name: Ben Bot CI

on:
  pull_request:
    branches:
      - main
      - release/*

jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Lint code (non-blocking)
        continue-on-error: true
        run: npm run lint

      - name: Clear log and cache files
        run: |
          if [ -f "bot.log" ]; then echo "" > bot.log; else echo "bot.log not found - skipping"; fi
          if [ -f "resources/cache/cache.json" ]; then 
            echo "" > resources/cache/cache.json
          else 
            mkdir -p resources/cache
            echo '{ "hits": 0, "miss": 0 }' > resources/cache/cache.json
          fi

      - name: Validate environment variables
        run: |
          if [ -z "$BOTTOKEN" ] || [ -z "$BOTID" ] || [ -z "$OWNERID" ]; then
            echo "::error::Missing critical environment variables"
            exit 1
          fi

      - name: Run bot and verify deployment (with real-time logs)
        env:
          BENBOT_DATABASE: ${{ secrets.BENBOT_DATABASE }}
          BENBOT_HOST: ${{ secrets.BENBOT_HOST }}
          BENBOT_PASSWORD: ${{ secrets.BENBOT_PASSWORD }}
          BENBOT_TABLE: ${{ secrets.BENBOT_TABLE }}
          BENBOT_USER: ${{ secrets.BENBOT_USER }}
          BOTTOKEN: ${{ secrets.BOTTOKEN }}
          BOTID: ${{ secrets.BOTID }}
          OWNERID: ${{ secrets.OWNERID }}
          BOT_MODE: ${{ vars.BOT_MODE }}
          HALT_ON_ERROR: ${{ vars.HALT_ON_ERROR }}
          LOG_FILE: ${{ vars.LOG_FILE }}
          LOG_TO_CONSOLE: ${{ vars.LOG_TO_CONSOLE }}
          LOG_TO_FILE: ${{ vars.LOG_TO_FILE }}
        run: |
          # Start bot in background and pipe logs to file
          node bot.js > bot.log 2>&1 &
          BOT_PID=$!
          echo "Bot started in background (PID: $BOT_PID)"
          
          # Wait for deployment (max 30 seconds)
          echo "Waiting for deployment confirmation..."
          for i in {1..30}; do
            if grep -q -E "Successfully deployed [0-9]+ commands|All shards \[[0-9]+\] launched successfully" bot.log; then
              echo "✅ Deployment successful!"
              kill $BOT_PID
              exit 0
            fi
            sleep 1
          done
          
          # If we get here, the bot didn't print success message
          echo "::error::Deployment confirmation not found within 30 seconds"
          echo "=== Last 20 lines of bot.log ==="
          tail -n 20 bot.log
          kill $BOT_PID
          exit 1

  version-and-release:
    needs: release-check
    if: ${{ success() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '22'

      - name: Bump patch version
        run: |
          current=$(node -p "require('./package.json').version")
          IFS='.' read -r major minor patch <<< "$current"
          new_version="$major.$minor.$((patch+1))"
          echo "Bumping version to $new_version"
          npm version $new_version --no-git-tag-version
          echo "new_version=$new_version" >> $GITHUB_ENV

      - name: Generate simple changelog
        run: |
          echo "## Changes in v${{ env.new_version }}" > CHANGELOG.md
          echo "" >> CHANGELOG.md
          git log -1 --pretty=format:"- %s" >> CHANGELOG.md

      - name: Commit version bump and changelog
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "chore: bump version to v${{ env.new_version }}"
          git push

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.new_version }}
          name: Release v${{ env.new_version }}
          body_path: CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

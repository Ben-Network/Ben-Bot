name: Ben Bot CI

on:
  pull_request:
    branches:
      - main
      - release/*

jobs:
  release-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Lint code
        run: npm run lint

      - name: Empty release-specific files
        run: |
          echo "" > bot.log || true
          echo "" > resources/cache/cache.json || true
          echo '{ "hits": null, "miss": null}' > resources/cache/cache-analytics.json || true
          echo "" > resources/cache/replay.log || true
        shell: bash

      - name: Validate environment variables
        run: |
          [[ -z "$BOTTOKEN" || -z "$BOTID" || -z "$OWNERID" ]] && echo "Missing critical env vars" && exit 1
        shell: bash

      - name: Run bot and check for deployment confirmation
        env:
          BENBOT_DATABASE: ${{ secrets.BENBOT_DATABASE }} 
          BENBOT_HOST: ${{ secrets.BENBOT_HOST }} 
          BENBOT_PASSWORD: ${{ secrets.BENBOT_PASSWORD }} 
          BENBOT_TABLE: ${{ secrets.BENBOT_TABLE }} 
          BENBOT_USER: ${{ secrets.BENBOT_USER }} 
          BOTTOKEN: ${{ secrets.BOTTOKEN }} 
          BOTID: ${{ secrets.BOTID }} 
          OWNERID: ${{ secrets.OWNERID }} 
          BOT_MODE: ${{ vars.BOT_MODE }} 
          HALT_ON_ERROR: ${{ vars.HALT_ON_ERROR }} 
          LOG_FILE: ${{ vars.LOG_FILE }} 
          LOG_TO_CONSOLE: ${{ vars.LOG_TO_CONSOLE }} 
          LOG_TO_FILE: ${{ vars.LOG_TO_FILE }} 
        run: |
          OUTPUT=$(node bot.js || echo "error")
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "Successfully deployed" || (echo "❌ Deployment confirmation missing" && exit 1)

      - name: Request review from GitHub Copilot
        uses: github/cli-action@v1
        with:
          script: |
            gh pr review "$PR_NUMBER" --request --body "Requesting review from GitHub Copilot for deployment readiness."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

  release:
    needs: release-check
    if: ${{ success() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          release_name: Release v${{ github.run_number }}
          draft: false
          prerelease: false
